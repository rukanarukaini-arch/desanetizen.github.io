<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desa Netizen</title>
<style>
body{font-family:Arial;background:#FFF8E1;padding:12px;text-align:center}
.box{background:white;max-width:400px;margin:auto;padding:16px;border-radius:16px}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ddd}
button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;background:#22c55e;color:white}
#desa{height:220px;background:#87CEEB;border-radius:14px;position:relative;overflow:hidden;margin-top:12px}
.warga{position:absolute;bottom:10px;font-size:30px;text-align:center}
.warga span{display:block;background:white;font-size:11px;font-weight:bold;padding:2px 6px;border-radius:10px}
#ktp{width:100%;display:none;margin-top:10px;border-radius:12px}
</style>
</head>
<body>
<h2>🏡 DESA NETIZEN</h2>
<p>Diurus Pak Selamet</p>

<div class="box">
<input id="nama" placeholder="Nama kamu">
<select id="emoji">
<option value="🧑">🧑 Orang Biasa</option>
<option value="👨‍🌾">👨‍🌾 Petani</option>
<option value="🧕">🧕 Mbak-Mbak</option>
<option value="👮">👮 Satpam</option>
<option value="👧">👧 Bocil</option>
</select>
<select id="jabatan">
<option>Menteri Jajan</option>
<option>Tukang Gosip</option>
<option>Satpam Portal</option>
<option>Bendahara Kopi</option>
</select>
<button onclick="daftar()">BUAT KTP & JADI WARGA →</button>
<canvas id="ktp" width="600" height="360"></canvas>
<button onclick="download()" style="background:#2563eb;margin-top:8px">⬇ DOWNLOAD KTP</button>
</div>

<div class="box" style="margin-top:12px">
<b>DESA LIVE - Total Warga: <span id="total">1</span></b>
<div id="desa">
<div style="position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#FF2D55;color:white;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:bold">DESA NETIZEN</div>
<div id="area"></div>
</div>
<div id="list" style="text-align:left;font-size:13px;margin-top:8px"></div>
</div>

<script>
let warga=[{nama:"Pak Selamet",emoji:"🧔",jabatan:"Kepala Desa"}];
function daftar(){
  let nama=document.getElementById("nama").value || "Warga Baru";
  let emoji=document.getElementById("emoji").value;
  let jabatan=document.getElementById("jabatan").value;
  // Bikin KTP
  let c=document.getElementById("ktp"), x=c.getContext("2d");
  x.fillStyle="#FFD93D"; x.fillRect(0,0,600,360);
  x.fillStyle="#fff"; x.fillRect(0,0,600,60);
  x.fillStyle="#111"; x.font="bold 26px Arial"; x.textAlign="center";
  x.fillText("KTP DESA NETIZEN",300,40);
  x.textAlign="left"; x.font="bold 18px Arial";
  x.fillText("Nama: "+nama,30,110);
  x.fillText("Jabatan: "+jabatan,30,150);
  x.fillText("Karakter: "+emoji,30,190);
  x.font="16px Arial"; x.fillText("Sidoarjo - Pak Selamet (SAH!)",30,300);
  c.style.display="block";
  // Tambah warga ke desa
  warga.push({nama,emoji,jabatan});
  tampil();
}
function tampil(){
  document.getElementById("total").innerText=warga.length;
  let area=document.getElementById("area"); area.innerHTML="";
  let list=document.getElementById("list"); list.innerHTML="";
  warga.forEach((w,i)=>{
    let d=document.createElement("div"); d.className="warga";
    d.style.left=(10+i*55)+"px";
    d.innerHTML=w.emoji+"<span>"+w.nama.split(" ")[0]+"</span>";
    area.appendChild(d);
    list.innerHTML+="<div>• "+w.emoji+" <b>"+w.nama+"</b> - "+w.jabatan+"</div>";
  });
}
function download(){
  let c=document.getElementById("ktp");
  let a=document.createElement("a");
  a.download="KTP-Desa-Netizen.png"; a.href=c.toDataURL(); a.click();
}
tampil();
</script>
</body>
  </html>
