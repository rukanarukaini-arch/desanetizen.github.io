<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DESA NETIZEN - MAIN MIRING HP</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Segoe UI',Arial;background:#0f172a;color:#fff;overflow:hidden;user-select:none}
#arena{width:100vw;height:100vh;background:linear-gradient(180deg,#7dd3fc 0%,#38bdf8 30%,#4ade80 70%,#22c55e 100%);position:relative;overflow:hidden}
#arena.malam{background:linear-gradient(180deg,#0f172a,#1e293b)!important}
#arena.hujan{background:linear-gradient(180deg,#475569,#334155)!important}
#arena.salju{background:linear-gradient(180deg,#e0f2fe,#fff)!important}
#arena.pelangi{background:linear-gradient(90deg,#f87171,#facc15,#4ade80,#38bdf8,#a78bfa)!important}
#karakter{position:absolute;font-size:64px;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;filter:drop-shadow(0 6px 8px rgba(0,0,0,0.4));transition:0.12s}
.bangunan{position:absolute;font-size:42px;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.3))}
#efekCuaca{position:absolute;inset:0;pointer-events:none;z-index:5;font-size:22px;overflow:hidden;white-space:pre-line;line-height:1.8}
.glass{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.3);box-shadow:0 8px 20px rgba(0,0,0,0.25)}
.btn-bulat{width:60px;height:60px;border-radius:50%;border:2px solid rgba(255,255,255,0.9);font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,0.35);transition:0.1s;color:#fff}
.btn-bulat:active{transform:scale(0.85)}
.btn-kecil{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,0.85);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.3);transition:0.1s;color:#fff}
.btn-kecil:active{transform:scale(0.85)}
.btn-kecil.aktif,.btn-bulat.aktif{border:3px solid #facc15!important;box-shadow:0 0 0 3px rgba(250,204,21,0.4),0 6px 14px rgba(0,0,0,0.35)!important;transform:scale(1.08)}
.pill{padding:9px 14px;border-radius:22px;font-size:12px;font-weight:800;text-decoration:none;color:#fff;display:flex;align-items:center;gap:4px;border:1px solid rgba(255,255,255,0.3)}
.label-mini{font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.9);font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,0.5);text-align:center;margin-bottom:6px}
#layarLogin{position:fixed;inset:0;background:#0f172a;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#layarLogin input{padding:14px;border-radius:12px;border:none;width:100%;max-width:300px;margin:6px 0;font-size:16px;text-align:center}
#layarLogin button{padding:14px;border:none;border-radius:12px;background:#22c55e;color:#fff;font-weight:bold;font-size:16px;width:100%;max-width:300px;margin-top:10px}
</style>
</head>
<body>
<div id="layarLogin">
  <div style="font-size:60px">🏡</div>
  <h1 style="margin:5px">DESA NETIZEN</h1>
  <p style="color:#94a3b8;font-size:13px">Main Miring HP + Cuaca + Kendaraan!<br>Buat KTP dulu biar bisa main!</p>
  <input id="inputNama" placeholder="Nama Kamu (Contoh: Andi)">
  <input id="inputUser" placeholder="Username (Contoh: andi123)">
  <div style="display:flex;gap:6px;max-width:300px;width:100%;justify-content:center">
    <button onclick="pilihEmoji('🧑')" style="background:#3b82f6;flex:1">🧑</button>
    <button onclick="pilihEmoji('👧')" style="background:#ec4899;flex:1">👧</button>
    <button onclick="pilihEmoji('👦')" style="background:#f59e0b;flex:1">👦</button>
    <button onclick="pilihEmoji('👩')" style="background:#8b5cf6;flex:1">👩</button>
  </div>
  <p style="font-size:12px">Emoji dipilih: <b id="emojiDipilih">🧑</b></p>
  <button onclick="masukDesa()">🚀 MASUK DESA!</button>
  <p style="font-size:11px;color:#666">Pak RT & Bot bisa atur cuaca. Warga lain cuma bisa lihat.</p>
</div>
<div id="arena">
  <div id="efekCuaca"></div>
  <div class="bangunan" style="left:4%;top:14%">🏠</div>
  <div class="bangunan" style="right:5%;top:14%">🏪</div>
  <div class="bangunan" style="left:4%;top:52%">🌳🌳</div>
  <div class="bangunan" style="right:6%;top:52%">⛲</div>
  <div class="bangunan" style="left:38%;top:10%">🏫</div>
  <div class="bangunan" style="left:48%;bottom:18%">⚽</div>
  <div class="bangunan" style="left:20%;top:35%">💰</div>
  <div class="bangunan" style="right:22%;top:35%">💰</div>
  <div id="karakter">🧑</div>
  <div style="position:absolute;left:50%;top:78%;transform:translateX(-50%);font-size:13px;background:rgba(0,0,0,0.45);padding:5px 12px;border-radius:20px;z-index:20" id="pesanCuaca">☀️ CERAH - Jalan Cepet!</div>
</div>
<div style="position:fixed;top:10px;left:10px;z-index:60;display:flex;gap:8px;align-items:center" class="glass pill">
  <span id="avatarPemain" style="font-size:22px">🧑</span>
  <div><div id="namaPemain" style="font-size:13px">Memuat...</div><div style="font-size:11px">💰 <b id="koinTxt">1000</b> • <span id="kendaraanTxt">Jalan Kaki</span></div></div>
</div>
<div style="position:fixed;top:10px;right:10px;z-index:60;display:flex;gap:6px;max-width:58vw;overflow-x:auto;padding:7px;border-radius:30px" class="glass">
  <button class="btn-kecil" style="background:#f59e0b" onclick="gantiCuaca('cerah')">☀️</button>
  <button class="btn-kecil" style="background:#3b82f6" onclick="gantiCuaca('hujan')">🌧️</button>
  <button class="btn-kecil" style="background:#1d4ed8" onclick="gantiCuaca('hujanDeras')">⛈️</button>
  <button class="btn-kecil" style="background:#38bdf8" onclick="gantiCuaca('salju')">❄️</button>
  <button class="btn-kecil" style="background:#0ea5e9" onclick="gantiCuaca('saljuLebat')">🌨️</button>
  <button class="btn-kecil" style="background:#ec4899" onclick="gantiCuaca('pelangi')">🌈</button>
  <button class="btn-kecil" style="background:#1e293b" onclick="gantiCuaca('malam')">🌙</button>
  <button class="btn-kecil" style="background:#7c3aed" onclick="gantiCuaca('petir')">⚡</button>
  <button class="btn-kecil" style="background:#64748b" onclick="gantiCuaca('kabut')">🌫️</button>
  <button class="btn-kecil" style="background:#d97706" onclick="gantiCuaca('berangin')">🍂</button>
</div>
<div style="position:fixed;bottom:14px;left:12px;z-index:60">
  <div class="label-mini">🕹️ GERAK</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;width:172px;padding:10px;border-radius:22px" class="glass">
    <div></div>
    <button class="btn-bulat" style="background:rgba(59,130,246,0.95)" onmousedown="gerak('atas')" ontouchstart="gerak('atas')">⬆️</button><div></div>
    <button class="btn-bulat" style="background:rgba(59,130,246,0.95)" onmousedown="gerak('kiri')" ontouchstart="gerak('kiri')">⬅️</button>
    <button class="btn-bulat" style="background:rgba(59,130,246,0.95)" onmousedown="gerak('bawah')" ontouchstart="gerak('bawah')">⬇️</button>
    <button class="btn-bulat" style="background:rgba(59,130,246,0.95)" onmousedown="gerak('kanan')" ontouchstart="gerak('kanan')">➡️</button>
  </div>
  <div style="display:flex;gap:7px;margin-top:8px;justify-content:center">
    <button class="btn-kecil" id="btnTilt" onclick="toggleTilt()" style="background:#8b5cf6">📱</button>
    <button class="btn-kecil" onclick="lompat()" style="background:#f59e0b">🦘</button>
    <button class="btn-kecil" onclick="duduk()" style="background:#14b8a6">🧘</button>
  </div>
  <div id="tiltInfo" style="font-size:10px;text-align:center;margin-top:4px;color:#fff;text-shadow:0 1px 2px #000">📱 Miring: OFF • 🦘 Lompat • 🧘 Duduk</div>
</div>
<div style="position:fixed;bottom:14px;right:12px;z-index:60">
  <div class="label-mini">🚲 KENDARAAN</div>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:center;padding:10px;border-radius:22px" class="glass">
    <button class="btn-bulat" id="k-helikopter" onclick="gantiKendaraan('helikopter','🚁','Helikopter',8)" style="background:#dc2626">🚁</button>
    <button class="btn-bulat" id="k-mobil" onclick="gantiKendaraan('mobil','🚗','Mobil',6)" style="background:#16a34a">🚗</button>
    <button class="btn-bulat" id="k-motor" onclick="gantiKendaraan('motor','🏍️','Motor',4)" style="background:#ea580c">🏍️</button>
    <button class="btn-bulat" id="k-sepeda" onclick="gantiKendaraan('sepeda','🚲','Sepeda',2)" style="background:#0284c7">🚲</button>
    <button class="btn-bulat aktif" id="k-jalan" onclick="gantiKendaraan('jalan','🧑','Jalan Kaki',1)" style="background:#475569">🚶</button>
  </div>
</div>
<div style="position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;padding:7px;border-radius:20px" class="glass">
  <button class="btn-kecil" id="k-kuda" onclick="gantiKendaraan('kuda','🐴','Kuda',3)" style="background:#a16207">🐴</button>
  <button class="btn-kecil" id="k-becak" onclick="gantiKendaraan('becak','🛺','Becak',2)" style="background:#0891b2">🛺</button>
  <button class="btn-kecil" id="k-truk" onclick="gantiKendaraan('truk','🚚','Truk',5)" style="background:#9333ea">🚚</button>
  <button class="btn-kecil" id="k-perahu" onclick="gantiKendaraan('perahu','🚣','Perahu',3)" style="background:#0e7490">🚣</button>
</div>
<div style="position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:8px">
  <button class="pill glass" style="background:rgba(34,197,94,0.85);border:none" onclick="bukaToko()">🏪 TOKO</button>
  <button class="pill glass" style="background:rgba(249,115,22,0.85);border:none" onclick="bukaRumah()">🏠 RUMAH</button>
  <button class="pill glass" style="background:rgba(239,68,68,0.85);border:none" onclick="keluarDesa()">🚪 KELUAR</button>
</div>
<script>
let saya = JSON.parse(localStorage.getItem('ktpSaya')||'null');
let emojiDipilih = '🧑';
let koin = 1000;
let x=50,y=50,kecepatan=1,tiltAktif=false,gyroX=0,gyroY=0;
function pilihEmoji(e){ emojiDipilih=e; document.getElementById('emojiDipilih').innerText=e; }
function masukDesa(){
  let nama=document.getElementById('inputNama').value.trim();
  let user=document.getElementById('inputUser').value.trim().toLowerCase();
  if(!nama||!user){ alert('Isi Nama & Username dulu!'); return; }
  let isRT = (user==='pakrt'||user==='admin');
  saya={nama:nama,user:user,emoji:emojiDipilih,isRT:isRT};
  localStorage.setItem('ktpSaya',JSON.stringify(saya));
  if(!localStorage.getItem('koin_'+user)) localStorage.setItem('koin_'+user,'1000');
  mulaiGame();
}
function mulaiGame(){
  document.getElementById('layarLogin').style.display='none';
  koin=parseInt(localStorage.getItem('koin_'+saya.user)||'1000');
  document.getElementById('avatarPemain').innerText=saya.emoji;
  document.getElementById('namaPemain').innerText=saya.nama+' (@'+saya.user+')'+(saya.isRT?' 👑 RT':'');
  document.getElementById('koinTxt').innerText=koin.toLocaleString();
  document.getElementById('karakter').innerText=saya.emoji;
  let cuacaLama=localStorage.getItem('cuacaDesa')||'cerah';
  document.getElementById('pesanCuaca').innerText='Cuaca Desa: '+cuacaLama;
}
if(saya){ mulaiGame(); }
function updatePos(){ document.getElementById('karakter').style.left=x+'%'; document.getElementById('karakter').style.top=y+'%'; }
function gerak(a){
  let s=3*kecepatan;
  if(a==='atas')y-=s; if(a==='bawah')y+=s; if(a==='kiri')x-=s; if(a==='kanan')x+=s;
  if(x<6)x=6; if(x>94)x=94; if(y<14)y=14; if(y>88)y=88;
  updatePos();
}
function lompat(){ let k=document.getElementById('karakter'); k.style.fontSize='82px'; setTimeout(()=>k.style.fontSize='64px',220); }
function duduk(){ let k=document.getElementById('karakter'); let lama=k.innerText; k.innerText='🧘'; setTimeout(()=>k.innerText=lama,800); }
function gantiKendaraan(jenis,emoji,nama,cepat){
  kecepatan=cepat; let k=document.getElementById('karakter'); k.innerText=emoji;
  document.getElementById('kendaraanTxt').innerText=nama;
  document.querySelectorAll('[id^="k-"]').forEach(b=>b.classList.remove('aktif'));
  let el=document.getElementById('k-'+jenis); if(el) el.classList.add('aktif');
}
function gantiCuaca(c){
  if(!saya){ alert('Masuk dulu!'); return; }
  let boleh = saya.isRT || ['bot','botdesa','admin','pakrt'].includes(saya.user.toLowerCase());
  if(!boleh){ alert('🔒 Cuma Pak RT & Bot yang bisa ganti cuaca! Kamu warga, nikmatin aja!'); return; }
  localStorage.setItem('cuacaDesa',c);
  let teks={cerah:'☀️ CERAH - Jalan Cepet!',hujan:'🌧️ HUJAN - Bawa Payung!',hujanDeras:'⛈️ BADAI - Di Rumah Aja!',salju:'❄️ SALJU - Bikin Boneka Salju!',saljuLebat:'🌨️ SALJU LEBAT - Dingin!',pelangi:'🌈 PELANGI - Cantik! +50 Koin!',malam:'🌙 MALAM - Bintang!',petir:'⚡ PETIR - Duar!',kabut:'🌫️ KABUT - Hati-hati!',berangin:'🍂 BERANGIN - Daun Jatuh!'};
  document.getElementById('pesanCuaca').innerText=teks[c]||teks.cerah;
  let arena=document.getElementById('arena');
  arena.classList.remove('malam','hujan','salju','pelangi');
  if(c==='malam') arena.classList.add('malam');
  if(c==='hujan'||c==='hujanDeras'||c==='petir') arena.classList.add('hujan');
  if(c==='salju'||c==='saljuLebat') arena.classList.add('salju');
  if(c==='pelangi') arena.classList.add('pelangi');
  let efek=document.getElementById('efekCuaca');
  if(c==='hujan'||c==='hujanDeras') efek.innerText='🌧️  🌧️  🌧️\n 🌧️  🌧️  🌧️\n🌧️  🌧️  🌧️';
  else if(c==='salju'||c==='saljuLebat') efek.innerText='❄️  ❄️  ❄️\n  ❄️  ❄️\n❄️  ❄️  ❄️';
  else if(c==='pelangi') efek.innerText='🌈';
  else efek.innerText='';
  if(c==='pelangi'){ koin+=50; localStorage.setItem('koin_'+saya.user,koin); document.getElementById('koinTxt').innerText=koin.toLocaleString(); }
}
function toggleTilt(){
  tiltAktif=!tiltAktif;
  document.getElementById('tiltInfo').innerText='📱 Miring: '+(tiltAktif?'ON - Goyang HP-mu!':'OFF')+' • 🦘 Lompat • 🧘 Duduk';
  document.getElementById('btnTilt').style.background=tiltAktif?'#22c55e':'#8b5cf6';
  if(tiltAktif){
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(r=>{ if(r!=='granted') alert('Pencet Allow ya!'); });
    }
    window.addEventListener('deviceorientation',e=>{ gyroX=e.gamma||0; gyroY=e.beta||0; });
    setInterval(()=>{ if(tiltAktif){ x+=gyroX*0.25; if(gyroY>55) y+=2; if(gyroY<38) y-=2; if(x<6)x=6; if(x>94)x=94; if(y<14)y=14; if(y>88)y=88; updatePos(); } },50);
  }
}
function bukaToko(){ alert('🏪 TOKO DESA\n\n🚲 Sepeda - 500 Koin\n🏍️ Motor - 2000 Koin\n🚗 Mobil - 5000 Koin\n\nKoin kamu: '+koin); }
function bukaRumah(){ alert('🏠 RUMAHMU\n\nHai '+saya.nama+'!\nKoin: '+koin+'\nKendaraan: '+document.getElementById('kendaraanTxt').innerText+'\n\nRumahmu aman!'); }
function keluarDesa(){ if(confirm('Keluar dari desa?')){ localStorage.removeItem('ktpSaya'); location.reload(); } }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowUp')gerak('atas'); if(e.key==='ArrowDown')gerak('bawah'); if(e.key==='ArrowLeft')gerak('kiri'); if(e.key==='ArrowRight')gerak('kanan'); if(e.key===' ')lompat(); });
</script>
</body>
    </html>
