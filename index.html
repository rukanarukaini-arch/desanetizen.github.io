<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MINECRAFT DESA</title><style>*{box-sizing:border-box}body{margin:0;font-family:Courier,monospace;background:#000;color:#fff;overflow:hidden} #arena{width:100vw;height:100vh;position:relative;background:#87CEEB;overflow:hidden} #lantai{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(12,1fr)} .k{background:#5EBB2E;border:1px solid #3E8E1A}.k:nth-child(odd){background:#6ACF35} #kar{position:absolute;font-size:46px;left:50%;top:45%;transform:translate(-50%,-50%);z-index:20} .npc{position:absolute;font-size:32px;z-index:15;transition:1s;text-align:center}.npc span{font-size:8px;background:#000;color:#fff;padding:2px 5px;display:block}.blok{position:absolute;font-size:36px;z-index:10}.mc{background:#C6C6C6;border:3px solid #000;box-shadow:inset 2px 2px 0 #fff;color:#000}.btn{width:44px;height:44px;background:#C6C6C6;border:3px solid #000;font-size:20px;display:flex;align-items:center;justify-content:center}.pill{padding:8px 10px;background:#C6C6C6;border:3px solid #000;font-size:11px;font-weight:900;color:#000} #login{position:fixed;inset:0;background:#222;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center} #login input{padding:12px;width:100%;max-width:280px;margin:5px;text-align:center;font-weight:bold} #login button{padding:12px;background:#5EBB2E;color:#fff;font-weight:900;width:100%;max-width:280px;margin-top:8px;border:3px solid #000} #hotbar{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);display:flex;z-index:60;border:3px solid #000;background:#000}.slot{width:34px;height:34px;background:#8B8B8B;border:2px solid #373737;display:flex;align-items:center;justify-content:center;font-size:19px}.slot.on{background:#fff;border:2px solid gold}</style></head><body>
<div id="login"><div style="font-size:50px">⛏️</div><h1>MINECRAFT<br>DESA NETIZEN</h1><p style="font-size:12px">Kotak-kotak! Nambang! Bangun!</p><input id="n" placeholder="Nama Steve Kamu"><input id="u" placeholder="Username"><p>Karakter: <b id="e">🧑</b> <button onclick="pe('🧑')" style="width:40px">🧑</button><button onclick="pe('👧')" style="width:40px">👧</button><button onclick="pe('🧟')" style="width:40px">🧟</button><button onclick="pe('🐷')" style="width:40px">🐷</button></p><button onclick="masuk()">▶️ PLAY!</button><p style="font-size:11px;color:#aaa">pakrt = Creative! Bisa ganti cuaca!</p></div>
<div id="arena"><div id="lantai"></div><div class="blok" style="left:4%;top:16%">🏠</div><div class="blok" style="right:4%;top:16%">🏪</div><div class="blok" style="left:4%;top:50%">🌳</div><div class="blok" style="right:5%;top:52%">🍎</div><div class="blok" style="left:38%;top:14%">🧱🧱</div><div class="blok" style="left:42%;bottom:32%">💎</div><div class="blok" style="left:55%;bottom:32%">⛏️</div><div class="npc" id="n1" style="left:20%;top:30%">🧑<span>STEVE</span></div><div class="npc" id="n2" style="left:70%;top:35%">👧<span>ALEX</span></div><div class="npc" id="n3" style="left:30%;top:60%">🧑‍🌾<span>VILLAGER</span></div><div class="npc" id="n4" style="left:60%;top:60%">🧟<span>ZOMBIE</span></div><div class="npc" id="n5" style="left:80%;top:50%">🐷<span>BABI</span></div><div class="npc" id="n6" style="left:15%;top:45%">🐔<span>AYAM</span></div><div class="npc" id="n7" style="left:85%;top:25%">🐮<span>SAPI</span></div><div id="kar">🧑</div><div style="position:absolute;left:50%;top:68%;transform:translateX(-50%);background:#000;padding:5px 10px;border:2px solid #fff;font-size:11px;z-index:20;white-space:nowrap" id="cuaca">☀️ DAY - Survival!</div></div>
<div style="position:fixed;top:8px;left:8px;z-index:60;display:flex;gap:6px;padding:6px 10px" class="mc"><span id="av" style="font-size:20px">🧑</span><div><div id="nm" style="font-size:11px;font-weight:900">...</div><div style="font-size:10px">💰<b id="koin">1000</b> 💎<b id="dm">0</b> <span id="ken">Jalan Kaki</span></div></div><div>❤️❤️❤️❤️</div></div>
<div style="position:fixed;top:8px;right:8px;z-index:60;display:flex;gap:3px;padding:4px" class="mc"><button class="btn" style="width:36px;height:36px" onclick="cuacaF('cerah')">☀️</button><button class="btn" style="width:36px;height:36px" onclick="cuacaF('hujan')">🌧️</button><button class="btn" style="width:36px;height:36px" onclick="cuacaF('salju')">❄️</button><button class="btn" style="width:36px;height:36px" onclick="cuacaF('pelangi')">🌈</button><button class="btn" style="width:36px;height:36px" onclick="cuacaF('malam')">🌙</button></div>
<div style="position:fixed;bottom:100px;left:8px;z-index:60"><div style="font-size:9px;background:#000;text-align:center;padding:2px">GERAK</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;width:128px;padding:7px" class="mc"><div></div><button class="btn" ontouchstart="g('atas')">⬆️</button><div></div><button class="btn" ontouchstart="g('kiri')">⬅️</button><button class="btn" ontouchstart="g('bawah')">⬇️</button><button class="btn" ontouchstart="g('kanan')">➡️</button></div><div style="display:flex;gap:4px;margin-top:5px"><button class="btn" style="width:36px;height:36px" onclick="lompat()">🦘</button><button class="btn" style="width:36px;height:36px;background:gold" onclick="mine()">⛏️</button><button class="btn" style="width:36px;height:36px" onclick="sapa()">👋</button></div></div>
<div style="position:fixed;bottom:100px;right:8px;z-index:60"><div style="font-size:9px;background:#000;text-align:center;padding:2px">KENDARAAN</div><div style="display:flex;flex-direction:column;gap:4px;padding:5px" class="mc"><button class="btn" style="width:38px;height:38px" onclick="kend('🚁','Helikopter',8)">🚁</button><button class="btn" style="width:38px;height:38px" onclick="kend('🚗','Mobil',6)">🚗</button><button class="btn" style="width:38px;height:38px" onclick="kend('🏍️','Motor',4)">🏍️</button><button class="btn" style="width:38px;height:38px" onclick="kend('🚲','Sepeda',2)">🚲</button><button class="btn" style="width:38px;height:38px" onclick="kend('🧑','Jalan Kaki',1)">🚶</button></div></div>
<div id="hotbar"><div class="slot on" onclick="pb(this,'🧱')">🧱</div><div class="slot" onclick="pb(this,'🪨')">🪨</div><div class="slot" onclick="pb(this,'🪵')">🪵</div><div class="slot" onclick="pb(this,'💎')">💎</div><div class="slot" onclick="pb(this,'🌳')">🌳</div><div class="slot" onclick="pb(this,'🔥')">🔥</div><div class="slot" onclick="pb(this,'⛏️')">⛏️</div><div class="slot" onclick="pb(this,'🍎')">🍎</div></div>
<div style="position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:6px"><button class="pill" onclick="alert('SHOP: Blok 100, Diamond 500, Pickaxe 1000')">🏪 SHOP</button><button class="pill" onclick="alert('Rumahmu! Koin: '+koin)">🏠 HOUSE</button><button class="pill" onclick="localStorage.removeItem('ktpSaya');location.reload()">🚪 QUIT</button><button class="pill" style="background:gold" onclick="mine()">⛏️ MINE!</button></div>
<script>let saya=JSON.parse(localStorage.getItem('ktpSaya')||'null'),em='🧑',koin=1000,dm=0,x=50,y=45,sp=1,blok='🧱';let L=document.getElementById('lantai');for(let i=0;i<96;i++){let d=document.createElement('div');d.className='k';L.appendChild(d)}function pe(e){em=e;document.getElementById('e').innerText=e}function pb(el,b){blok=b;document.querySelectorAll('.slot').forEach(s=>s.classList.remove('on'));el.classList.add('on');alert('Blok: '+b)}function masuk(){let n=document.getElementById('n').value.trim(),u=document.getElementById('u').value.trim().toLowerCase();if(!n||!u){alert('Isi Nama & Username!');return}let rt=(u==='pakrt'||u==='admin');saya={nama:n,user:u,emoji:em,isRT:rt};localStorage.setItem('ktpSaya',JSON.stringify(saya));if(!localStorage.getItem('koin_'+u))localStorage.setItem('koin_'+u,'1000');mulai()}function mulai(){document.getElementById('login').style.display='none';koin=parseInt(localStorage.getItem('koin_'+saya.user)||'1000');document.getElementById('av').innerText=saya.emoji;document.getElementById('nm').innerText=saya.nama+' (@'+saya.user+')'+(saya.isRT?' 👑 CREATIVE':'');document.getElementById('koin').innerText=koin;document.getElementById('kar').innerText=saya.emoji;jalanNPC()}if(saya)mulai();function up(){document.getElementById('kar').style.left=x+'%';document.getElementById('kar').style.top=y+'%'}function g(a){let s=3*sp;if(a==='atas')y-=s;if(a==='bawah')y+=s;if(a==='kiri')x-=s;if(a==='kanan')x+=s;x=Math.max(6,Math.min(94,x));y=Math.max(18,Math.min(82,y));up()}function lompat(){let k=document.getElementById('kar');k.style.fontSize='60px';setTimeout(()=>k.style.fontSize='46px',200)}function sapa(){alert(['Halo! 👋','Mau trade?','Desa kita keren!','Main yuk!'][Math.floor(Math.random()*4)])}function mine(){let h=['🪨 Batu +10','💎 DIAMOND +100!!','🪵 Kayu +15','⛏️ Coal +20'];let d=h[Math.floor(Math.random()*h.length)];if(d.includes('DIAMOND')){dm++;koin+=100;document.getElementById('dm').innerText=dm}else if(d.includes('Coal'))koin+=20;else if(d.includes('Batu'))koin+=10;else koin+=15;localStorage.setItem('koin_'+saya.user,koin);document.getElementById('koin').innerText=koin;let k=document.getElementById('kar');k.innerText='⛏️';setTimeout(()=>k.innerText=saya.emoji,400);alert('⛏️ NAMBANG!\nDapat: '+d+'\nBlok dipasang: '+blok+'\nKoin: '+koin+' Diamond: '+dm)}function kend(e,nm,s){sp=s;document.getElementById('kar').innerText=e;document.getElementById('ken').innerText=nm}function cuacaF(c){if(!saya)return;let ok=saya.isRT||['bot','pakrt','admin'].includes(saya.user);if(!ok){alert('Cuma Creative (Pak RT) bisa ganti cuaca!');return}let t={cerah:'☀️ DAY - Survival!',hujan:'🌧️ RAIN - Cari Shelter!',salju:'❄️ SNOW!',pelangi:'🌈 RAINBOW +50!',malam:'🌙 NIGHT - Zombie!'};document.getElementById('cuaca').innerText=t[c];let a=document.getElementById('arena');a.style.background=c==='malam'?'#111':c==='hujan'?'#555':c==='salju'?'#e0f2fe':c==='pelangi'?'linear-gradient(90deg,red,yellow,green,blue)':'#87CEEB';if(c==='pelangi'){koin+=50;localStorage.setItem('koin_'+saya.user,koin);document.getElementById('koin').innerText=koin}}function jalanNPC(){setInterval(()=>{['n1','n2','n3','n4','n6','n7'].forEach(id=>{let e=document.getElementById(id);if(e){e.style.left=(10+Math.random()*75)+'%';e.style.top=(20+Math.random()*50)+'%'}})},1800);document.querySelectorAll('.npc').forEach(el=>el.addEventListener('click',()=>alert(el.querySelector('span').innerText+' bilang: Halo! 👋')))}</script></body></html>
