<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DESA NETIZEN 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#87CEEB}
.header{background:#0f172a;color:#fff;padding:14px;text-align:center}
.header a{display:inline-block;background:#22c55e;color:#fff;padding:10px 18px;border-radius:20px;text-decoration:none;font-weight:bold;margin-top:8px}
.desa{position:relative;height:520px;background:linear-gradient(#87CEEB 0%, #87CEEB 55%, #4ade80 55%, #22c55e 100%);overflow:hidden}
.rumah{position:absolute;width:120px;height:100px;background:#fff;border-radius:10px;text-align:center;box-shadow:0 10px 20px rgba(0,0,0,.2)}
.rumah span{font-size:40px;display:block;margin-top:18px}
.r1{left:8%;top:180px}.r2{right:8%;top:180px}.r3{left:22%;top:280px}.r4{right:22%;top:280px}
.warga-area{position:absolute;bottom:10px;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:10px}
.warga{background:#fff;border-radius:16px;padding:8px 10px;text-align:center;min-width:78px}
.warga div{font-size:38px}
.info{background:#fff;margin:14px;border-radius:16px;padding:16px;text-align:center}
</style>
</head>
<body>
<div class="header">
<h1>🏡 DESA NETIZEN 3D</h1>
<p>Desa Virtual Buat Netizen Santuy</p>
<a href="ktp.html">+ BIKIN KTP & MASUK DESA</a>
</div>
<div class="desa">
<div class="rumah r1"><span>🏠</span><b>BALAI DESA</b></div>
<div class="rumah r2"><span>🏪</span><b>WARUNG</b></div>
<div class="rumah r3"><span>🏫</span><b>SEKOLAH</b></div>
<div class="rumah r4"><span>🕌</span><b>MUSHOLA</b></div>
<div class="warga-area" id="wargaArea"></div>
</div>
<div class="info"><h2>👥 Warga Desa</h2><p id="pesan">Loading...</p></div>
<script>
let warga = JSON.parse(localStorage.getItem('wargaDesa') || '[]');
let area = document.getElementById('wargaArea');
if(warga.length==0){
document.getElementById('pesan').innerText='Belum ada warga. Bikin KTP dulu!';
area.innerHTML='<div style="background:#fff;padding:10px 16px;border-radius:20px">👻 Desa masih sepi...</div>';
}else{
document.getElementById('pesan').innerText='Ada '+warga.length+' warga di desa!';
area.innerHTML = warga.map(w=>'<div class="warga"><div>'+w.emoji+'</div><b>'+w.nama+'</b><br><small>'+w.user+'</small></div>').join('');
}
</script>
</body>
  </html>
